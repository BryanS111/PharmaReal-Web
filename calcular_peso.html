<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calcular pero ideal</title>
</head>
<body class="contenido">
    <header class="hder">
        <h2>Calcula tu peso ideal</h2>
         <a href="index.html"><button class="butHead" type="button">Volver</button></a>
    </header>
    <main>
        <section class="tarjeta-servicio formulario">
            <label for="peso">Peso:</label>
            <input type="number" id="peso" name="peso" placeholder="Escribe tu peso en kilogramos" min="100" max="250" step="0.1">
            <label for="peso">Estatura:</label>
            <input type="number" id="estatura" name="estatura" placeholder="Escribe tu estatura" min="1" max="500" step="0.1" >
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="1" max="120" step="1" placeholder="Escribe tu edad">
            <label for="sexo">Sexo:</label>
                <select id="sexo">
                    <option value="">Seleccione una opción</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                </select>
            <button class="butHead" type="button" id="calcular">Calcular peso ideal</button>
            <div class="resultado" id="resultado"></div>
        </section>
        
    </main>
    <script src="main.js"></script>
</body>
</html>
